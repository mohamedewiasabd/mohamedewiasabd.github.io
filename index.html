<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="محمد عويس عبدالفتاح (ELASTAD) — الموقع الرسمي للمطوّر وتطبيقاته." />
<meta name="theme-color" content="#059669" />
<title>محمد عويس عبدالفتاح — ELASTAD</title>
<style>
  :root { --emerald:#059669; --teal:#0d9488; --ink:#0f172a; --muted:#475569; --bg:#f8fafc; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.8; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:640px; width:100%; background:#fff; border:1px solid #e2e8f0; border-radius:24px; padding:32px 26px; box-shadow:0 10px 34px rgba(15,23,42,.07); text-align:center; }
  .avatar { width:76px; height:76px; border-radius:22px; margin:0 auto 16px; background:linear-gradient(135deg,var(--emerald),var(--teal)); color:#fde68a; display:flex; align-items:center; justify-content:center; font-size:1.7rem; font-weight:800; box-shadow:0 10px 26px rgba(5,150,105,.3); }
  h1 { font-size:1.35rem; color:var(--emerald); margin-bottom:4px; }
  .role { font-size:.85rem; color:var(--muted); margin-bottom:22px; }
  .links { display:grid; gap:10px; text-align:right; }
  a.btn { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:13px 16px; text-decoration:none; color:var(--ink); font-weight:600; transition:.15s; }
  a.btn:hover { border-color:var(--emerald); background:#ecfdf5; }
  a.btn small { color:var(--muted); font-weight:400; direction:ltr; }
  .foot { margin-top:20px; font-size:.78rem; color:#94a3b8; }
  .foot a { color:var(--teal); }
  @media (prefers-color-scheme: dark) {
    body { background:#0c110e; color:#eae5d9; }
    .card { background:#131b17; border-color:#243029; }
    a.btn { background:#0f1713; border-color:#243029; color:#eae5d9; }
    a.btn:hover { background:#16241d; border-color:#34d399; }
    a.btn small { color:#94a3a1; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">م ع</div>
    <h1>محمد عويس عبدالفتاح</h1>
    <p class="role">مطور تطبيقات • ELASTAD</p>

    <div class="links">
      <a class="btn" href="https://mohamedewiasabd.github.io/mahdara-al-durus/">
        <span>محضر الدروس — التطبيق الذكي للمعلمين</span>
        <small>/mahdara-al-durus/</small>
      </a>
      <a class="btn" href="https://mohamedewiasabd.github.io/mahdara-al-durus/developer/">
        <span>صفحة المطور والتواصل ودعم التطوير</span>
        <small>/developer/</small>
      </a>
      <a class="btn" href="https://github.com/mohamedewiasabd/mahdara-al-durus">
        <span>الكود المصدري على GitHub</span>
        <small>/mahdara-al-durus</small>
      </a>
      <a class="btn" href="./app-ads.txt">
        <span>ملف الإعلانات الرسمي app-ads.txt</span>
        <small>/app-ads.txt</small>
      </a>
    </div>

    <p class="foot">للتواصل: <a href="mailto:admin@elastad.com">admin@elastad.com</a> · <a dir="ltr" href="tel:+201027606755">+201027606755</a></p>
  </div>
</body>
</html>
